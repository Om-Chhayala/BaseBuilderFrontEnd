<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo Application</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h2>Todo Application</h2>
    <form id="form">
      <label class="fields">Enter Title</label>
      <input id="titleid" class="inputs" name="title" type="text">
      <label class="fields">Enter Description</label>
      <input id="descriptionid" class="inputs" name="description" type="text">
      <button class="submitButton" type="submit">Submit</button>
    </form>
  </div>
  <div class="container">
    <h2>Todos</h2>
    <ul class="todo-list"></ul>
  </div>
  <script>
    const onSubmit = (event) => {
        event.preventDefault(); 
        const title = document.getElementById('titleid').value;
        const description = document.getElementById('descriptionid').value;    
        fetch('https://base-builder-work-shop.vercel.app/postTodo', {
            method : 'POST',
            headers : {
                "content-type" : "application/json"
            },
            body : JSON.stringify({title, description})
        }).then(response => response.json())
        .then(data => {
            console.log(data);
            fetchTodos();
            
        })
        .catch(error => console.log(error));
    };
    
    const fetchTodos = () => {
        fetch('https://base-builder-work-shop.vercel.app/getTodo')
        .then(response => {
            return response.json()
        })
        .then(data => {
            const parent = document.querySelector('.todo-list');
            parent.innerHTML = '';
            data.forEach(item => {
                const div = document.createElement('div');
                const titleli = document.createElement('li');
                const descriptionli = document.createElement('li');
                titleli.innerHTML = item.title;
                descriptionli.innerHTML = item.description;
                div.appendChild(titleli);
                div.appendChild(descriptionli);
                parent.appendChild(div);
            });
        })
        .catch(error => console.log(error));
    }
    window.onload = fetchTodos;
    document.getElementById('form').addEventListener('submit', onSubmit);
  </script>
</body>
</html>
